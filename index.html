<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roys Wanimbo | Stark Industries</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#220505,#090909 60%,#000);
  color:#fff;
  overflow-x:hidden;
}

/* WRAPPER */
.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
}

/* PARTICLE (HANYA DESKTOP) */
.particles{
  position:absolute;
  inset:0;
  background-image:radial-gradient(#fb923c33 1px,transparent 1px);
  background-size:28px 28px;
  opacity:.2;
}

/* HUD (HANYA DESKTOP) */
.hud,.hud2{
  position:absolute;
  border:1px solid rgba(249,115,22,.1);
  border-radius:50%;
  animation:spin 25s linear infinite;
  opacity:.15;
}

.hud{width:450px;height:450px}
.hud2{width:600px;height:600px;animation-direction:reverse}

/* CARD */
.card{
  position:relative;
  z-index:2;
  width:min(1000px,100%);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

/* LEFT */
.left{
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
}

/* TITLE */
.title{
  font-size:clamp(1.8rem,5vw,3.8rem);
  font-weight:900;
}

.grad{
  background:linear-gradient(90deg,#fde68a,#fb923c,#ef4444);
  -webkit-background-clip:text;
  color:transparent;
}

.sub{margin-top:10px;color:#fdba74}

/* BUTTON */
.enterBtn{
  margin-top:20px;
  padding:12px 20px;
  border:none;
  border-radius:999px;
  background:linear-gradient(90deg,#fb923c,#ef4444);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* RIGHT */
.right{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* FRAME (SIMPLIFIED) */
.frame{
  width:320px;
  height:380px;
  border-radius:25px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* REACTOR (lebih ringan) */
.reactor{
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  background:radial-gradient(circle,#67e8f9,#0284c7 50%,transparent 75%);
  opacity:.6;
}

/* RING (DIKURANGI) */
.ring{
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  border:2px solid rgba(103,232,249,.15);
  animation:spin 12s linear infinite;
}

/* AVATAR */
.avatar{
  width:160px;
  height:160px;
  border-radius:50%;
  overflow:hidden;
  border:3px solid #fb923c;
  z-index:2;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ANIMATION */
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE HP (OPTIMASI BESAR) */
@media(max-width:768px){

  .card{
    grid-template-columns:1fr;
    text-align:center;
  }

  .frame{
    width:260px;
    height:300px;
  }

  /* MATIKAN SEMUA EFEK BERAT */
  .hud,.hud2,.particles,.ring{
    display:none !important;
  }

  .left{
    padding:20px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="particles"></div>
  <div class="hud"></div>
  <div class="hud2"></div>

  <div class="card">

    <div class="left">
      <div class="title">Hi, I'm <span class="grad">Roys Wanimbo</span></div>
      <div class="sub" id="typing"></div>
 <br>
      <br> 
      <br>
      <br>
      <button class="enterBtn" id="enterBtn">
        Masuk ke Aplikasi
      </button>
    </div>

    <div class="right">
      <div class="frame">
        <div class="reactor"></div>
        <div class="ring"></div>

        <div class="avatar">
          <img src="https://royswanimbo-dev.github.io/royswanimbo.io/assets/images/roys/Profile-roys.png">
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* typing ringan */
const words = ['JARVIS Online','Full Stack Dev','System Ready'];

let i=0,j=0,del=false;
const el=document.getElementById('typing');

setInterval(()=>{
  const w=words[i];
  el.textContent=w.slice(0,j);

  if(!del){
    j++;
    if(j>w.length) del=true;
  }else{
    j--;
    if(j===0){
      del=false;
      i=(i+1)%words.length;
    }
  }
},140);

/* LOGIN INSTANT */
document.getElementById('enterBtn').addEventListener('click',()=>{
  window.location.replace('https://royswanimbo.base44.app/');
});
</script>

</body>
</html>
