<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roys Wanimbo | Stark Industries</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#220505,#090909 55%,#000);
  color:#fff;
  overflow-x:hidden; /* FIX utama HP */
}

/* WRAPPER */
.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
}

/* HUD */
.hud,.hud2{
  position:absolute;
  border:1px solid rgba(249,115,22,.18);
  border-radius:50%;
  animation:spin 18s linear infinite;
  opacity:.3;
}

.hud{width:500px;height:500px}
.hud2{width:650px;height:650px;animation-direction:reverse}

/* PARTICLE */
.particles{
  position:absolute;
  inset:0;
  background-image:radial-gradient(#fb923c55 1px,transparent 1px);
  background-size:24px 24px;
  opacity:.4;
}

/* CARD */
.card{
  position:relative;
  z-index:2;
  width:min(1100px,100%);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

/* LEFT */
.left{
  padding:35px;
  border-radius:25px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
}

/* TITLE */
.title{
  font-size:clamp(2rem,6vw,4.5rem);
  font-weight:900;
  line-height:1.1;
}

.grad{
  background:linear-gradient(90deg,#fde68a,#fb923c,#ef4444);
  -webkit-background-clip:text;
  color:transparent;
}

.sub{margin:12px 0;color:#fdba74}

/* RIGHT */
.right{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* FRAME */
.frame{
  width:350px;
  height:420px;
  border-radius:30px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.1);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* REACTOR */
.reactor{
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  background:radial-gradient(circle,#67e8f9,#0284c7 40%,transparent 70%);
  filter:blur(6px);
  opacity:.7;
}

/* RINGS */
.ring,.ring2,.ring3{
  position:absolute;
  border-radius:50%;
  border:2px solid rgba(103,232,249,.25);
}

.ring{width:220px;height:220px;animation:spin 8s linear infinite}
.ring2{width:280px;height:280px;animation:spinR 12s linear infinite}
.ring3{width:330px;height:330px;animation:spin 16s linear infinite}

/* AVATAR */
.avatar{
  width:180px;
  height:180px;
  border-radius:50%;
  overflow:hidden;
  z-index:2;
  border:4px solid #fb923c;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ENTER TEXT */
.enterTxt{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 18px;
  border-radius:999px;
  background:rgba(249,115,22,.15);
  border:1px solid rgba(249,115,22,.35);
  font-weight:700;
  font-size:14px;
}

/* LOADER */
.loader3d{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}

.loader3d.active{display:flex}

/* ANIMATION */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}

/* RESPONSIVE HP FIX */
@media(max-width:768px){
  .card{
    grid-template-columns:1fr;
    text-align:center;
  }

  .frame{
    width:280px;
    height:320px;
  }

  .hud,.hud2{
    display:none; /* penting: hapus gangguan di HP */
  }

  .left{
    padding:25px;
  }
}
</style>
</head>

<body>

<div class="wrap">
  <div class="particles"></div>
  <div class="hud"></div>
  <div class="hud2"></div>

  <div class="card">

    <div class="left">
      <div class="title">Hi, I'm <span class="grad">Roys Wanimbo</span></div>
      <div class="sub" id="typing"></div>

      <br>
        <br>
      <div class="enterTxt">Masuk Ke Aplikasi</div>
    </div>

    <div class="right">
      <div class="frame">
        <div class="reactor"></div>
        <div class="ring"></div>
        <div class="ring2"></div>
        <div class="ring3"></div>

        <div class="avatar">
          <img src="https://royswanimbo-dev.github.io/royswanimbo.io/assets/images/roys/Profile-roys.png">
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const words = [
  'JARVIS Online',
  'Armor Systems Ready',
  'Full Stack Developer'
];

let i=0,j=0,del=false;
const el=document.getElementById('typing');

setInterval(()=>{
  const w=words[i];
  el.textContent=w.slice(0,j);

  if(!del){
    j++;
    if(j>w.length){del=true;}
  }else{
    j--;
    if(j===0){
      del=false;
      i=(i+1)%words.length;
    }
  }
},120);

/* klik masuk */
document.body.addEventListener('click',()=>{
  window.location.href='https://royswanimbo.base44.app/';
},{once:true});
</script>

</body>
</html>
